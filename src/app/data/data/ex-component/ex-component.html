Ex

<form id="mainCatalog" [formGroup]="mainForm" (submit)="submitMainCatalog($event)">
  <label for="animal">Select animal</label>
  <select name="animal" formControlName="animal" id="animal">
    <option
      *ngFor="let option of (mainOptions$ | async);trackBy:trackByValue"
      [value]="option.value"
    >
      {{option.label}}
    </option>
  </select>
  <button type="submit">Send</button>
</form>
<br />
<form
  id="subCatalog"
  *ngIf="mainSelection$ | async"
  [formGroup]="subForm"
  (submit)="submitSecondCatalog($event)"
>
  <label for="sub">Select sub</label>
  <select name="sub" formControlName="sub" id="sub">
    <option
      *ngFor="let option2 of (secondOptions$ | async);trackBy: trackByValue"
      [value]="option2.value"
    >
      {{option2.label}}
    </option>
  </select>
  <button type="submit">Send</button>
</form>
<ng-container *ngIf="(mainSelection$ | async) && (secondSelection$ | async)">
  <pre *ngIf="tableData$ |async  as tableData">{{tableData | json}}</pre>
</ng-container>
<p *ngIf="loading">Loading...</p>
